<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Minimalist AI-powered travel planning engine.">
    <title>Venture - Travel Engine</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #000000;
            --accents-1: #111111;
            --accents-2: #333333;
            --accents-3: #444444;
            --accents-8: #fafafa;
            --primary: #ffffff;
            --secondary: #888888;
            --blue: #0070f3;
            --border: 1px solid var(--accents-2);
            --radius: 8px;
            --font-main: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-main); }
        body { background: var(--bg); color: var(--primary); min-height: 100vh; -webkit-font-smoothing: antialiased; }

        /* --- Layout --- */
        header {
            height: 64px;
            border-bottom: var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 1.5rem;
            position: sticky;
            top: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: saturate(180%) blur(5px);
            z-index: 1000;
        }

        .logo { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em; cursor: pointer; display: flex; align-items: center; gap: 0.5rem; }
        .logo-icon { width: 24px; height: 24px; background: var(--primary); color: var(--bg); border-radius: 4px; display: grid; place-items: center; font-size: 0.8rem; font-weight: 900; }

        .app-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 280px 1fr 280px;
            gap: 1px;
            background: var(--accents-2);
            min-height: calc(100vh - 64px);
        }

        .column { background: var(--bg); padding: 1.5rem; overflow-y: auto; height: calc(100vh - 64px); }
        .column::-webkit-scrollbar { width: 0; }

        /* --- Components --- */
        .section-title { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; color: var(--secondary); letter-spacing: 0.05em; margin-bottom: 1rem; display: block; }
        
        .card {
            border: var(--border);
            border-radius: var(--radius);
            padding: 1rem;
            margin-bottom: 1rem;
            transition: border-color 0.2s ease;
        }
        .card:hover { border-color: var(--secondary); }

        .input-group { margin-bottom: 1.25rem; }
        label { display: block; font-size: 0.875rem; color: var(--secondary); margin-bottom: 0.5rem; }
        
        input, select {
            width: 100%;
            background: var(--bg);
            border: var(--border);
            border-radius: var(--radius);
            padding: 0.6rem 0.75rem;
            color: var(--primary);
            font-size: 0.875rem;
            outline: none;
            transition: all 0.2s ease;
        }
        input:focus, select:focus { border-color: var(--primary); }
        option { background: var(--bg); color: var(--primary); }

        .btn {
            width: 100%;
            height: 40px;
            border-radius: var(--radius);
            border: none;
            background: var(--primary);
            color: var(--bg);
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn:hover { background: #ccc; }
        .btn-secondary { background: var(--bg); color: var(--primary); border: var(--border); }
        .btn-secondary:hover { background: var(--accents-1); border-color: var(--primary); }

        /* --- Itinerary & Feed --- */
        .itinerary-grid { display: flex; flex-direction: column; gap: 1rem; }
        .day-header { font-size: 1rem; font-weight: 600; margin-bottom: 0.75rem; border-bottom: var(--border); padding-bottom: 0.5rem; color: var(--secondary); }
        
        .activity {
            display: flex;
            gap: 1rem;
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--accents-1);
        }
        .activity:last-child { border-bottom: none; }
        .time-badge { font-size: 0.75rem; color: var(--secondary); width: 70px; flex-shrink: 0; }
        .activity-content { font-size: 0.875rem; }
        .activity-name { font-weight: 500; margin-bottom: 0.2rem; }
        .activity-desc { color: var(--secondary); font-size: 0.8rem; }

        #costChart { width: 100%; height: auto; max-width: 160px; margin: 0 auto 1.5rem; }
        
        .stat-row { display: flex; justify-content: space-between; font-size: 0.875rem; margin-bottom: 0.5rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--accents-1); }
        .stat-label { color: var(--secondary); }
        
        .chip-container { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem; }
        .chip { padding: 0.25rem 0.75rem; border: var(--border); border-radius: 100px; font-size: 0.75rem; cursor: pointer; color: var(--secondary); transition: all 0.2s ease; }
        .chip.active { background: var(--primary); color: var(--bg); border-color: var(--primary); }

        .hidden { display: none !important; }
        .flex { display: flex; }
        .gap-2 { gap: 0.5rem; }

        @media (max-width: 1100px) {
            .app-container { grid-template-columns: 1fr; }
            .column { height: auto; border-bottom: var(--border); }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="window.location.reload()">
            <div class="logo-icon">V</div>
            Venture
        </div>
        <div class="flex gap-2">
            <button class="btn btn-secondary" style="width: auto; height: 32px; padding: 0 0.75rem; font-size: 0.75rem;" onclick="copyTripLink()">Share</button>
            <button class="btn btn-secondary" style="width: auto; height: 32px; padding: 0 0.75rem; font-size: 0.75rem;" onclick="window.print()">Export</button>
        </div>
    </header>

    <div class="app-container">
        <!-- CONFIG -->
        <aside class="column">
            <span class="section-title">Configure Trip</span>
            
            <div class="input-group">
                <label>Origin</label>
                <select id="originSearch">
                    <option value="" disabled selected>From...</option>
                    <option value="Delhi">Delhi, IN</option>
                    <option value="Mumbai">Mumbai, IN</option>
                    <option value="Bangalore">Bangalore, IN</option>
                    <option value="New York">New York, US</option>
                    <option value="London">London, UK</option>
                </select>
            </div>

            <div class="input-group">
                <label>Destination</label>
                <select id="destSearch">
                    <option value="" disabled selected>To...</option>
                    <option value="Goa">Goa, IN</option>
                    <option value="Rajasthan">Rajasthan, IN</option>
                    <option value="Kerala">Kerala, IN</option>
                    <option value="Paris">Paris, FR</option>
                    <option value="Tokyo">Tokyo, JP</option>
                    <option value="Bali">Bali, ID</option>
                </select>
            </div>

            <div class="input-group">
                <label>Dates</label>
                <div class="flex gap-2">
                    <input type="date" id="dateStart">
                    <input type="date" id="dateEnd">
                </div>
            </div>

            <div class="input-group">
                <label>Preferences</label>
                <select id="groupSize" class="mb-4" style="margin-bottom: 0.75rem;">
                    <option value="solo">Solo</option>
                    <option value="couple">Couple</option>
                    <option value="family">Family</option>
                </select>
                <div class="chip-container" id="styleChips">
                    <div class="chip active" data-val="Adventure">Adventure</div>
                    <div class="chip" data-val="Cultural">Cultural</div>
                    <div class="chip" data-val="Relaxation">Relaxation</div>
                </div>
            </div>

            <button class="btn" onclick="generateTrip()">Generate Plan</button>

            <div style="margin-top: 2rem;">
                <span class="section-title">Insights</span>
                <div class="card" style="font-size: 0.75rem; color: var(--secondary); line-height: 1.6;">
                    <p>• Code: Geist Modular</p>
                    <p>• Security: CSP & .env</p>
                    <p>• A11y: WCAG AA</p>
                </div>
            </div>
        </aside>

        <!-- MAIN -->
        <main class="column" style="background: var(--accents-1);">
            <div id="welcomeState" style="text-align: center; padding-top: 20vh;">
                <h2 style="font-size: 1.5rem; font-weight: 600; margin-bottom: 0.5rem;">Venture Travel Engine</h2>
                <p style="color: var(--secondary); font-size: 0.875rem;">Create a production-ready itinerary in seconds.</p>
            </div>

            <div id="itineraryHeader" class="hidden">
                <div class="card" style="padding:0; overflow:hidden; height:200px; margin-bottom:1.5rem; background: var(--bg);">
                    <iframe id="googleMap" width="100%" height="100%" frameborder="0" style="border:0" 
                        src="https://www.google.com/maps/embed/v1/place?key=API_KEY&q=Travel" allowfullscreen></iframe>
                </div>
                <div class="flex justify-between items-center mb-6" style="margin-bottom: 1.5rem;">
                    <h2 id="itineraryTitle" style="font-size: 1.25rem; font-weight: 600;">Trip Overview</h2>
                </div>
                <div id="itineraryContent" class="itinerary-grid"></div>
            </div>
        </main>

        <!-- ANALYSIS -->
        <aside class="column">
            <span class="section-title">Cost Analysis</span>
            <div class="card">
                <canvas id="costChart" width="200" height="200"></canvas>
                <div id="budgetStatus" style="text-align:center; font-size: 0.875rem; font-weight:600; margin-bottom:1.5rem;"></div>
                <div id="costTable">
                    <!-- Dynamic -->
                </div>
            </div>

            <span class="section-title">Network Status</span>
            <div id="simulationTicker" style="font-size: 0.75rem; color: var(--secondary);"></div>
        </aside>
    </div>

    <script>
        const DESTINATIONS = {
            'Goa': { activities: [{name:'Beach Yoga',time:'08:00',desc:'Sunrise session'},{name:'Old Goa Tour',time:'14:00',desc:'Churches & History'},{name:'Thalassa Dinner',time:'19:00',desc:'Sunset views'}], baseCosts: {flight:8000,hotel:4000,food:1500,misc:500} },
            'Paris': { activities: [{name:'Louvre',time:'09:00',desc:'Art & Icons'},{name:'Seine Cruise',time:'15:00',desc:'River views'},{name:'Eiffel View',time:'20:00',desc:'Night lights'}], baseCosts: {flight:60000,hotel:15000,food:5000,misc:2000} },
            'Tokyo': { activities: [{name:'Fish Market',time:'07:00',desc:'Sushi breakfast'},{name:'Shibuya Sky',time:'16:00',desc:'City views'},{name:'Izakaya Night',time:'21:00',desc:'Local food'}], baseCosts: {flight:50000,hotel:12000,food:4000,misc:1500} }
        };

        const MESSAGES = ["Flight prices tracking...", "Optimal hotel slots found", "Local weather: Ideal"];
        const state = { destination: '', days: 0, itinerary: [] };

        document.addEventListener('DOMContentLoaded', () => {
            const today = new Date();
            const todayStr = today.toISOString().split('T')[0];
            const nextWeek = new Date(today);
            nextWeek.setDate(today.getDate() + 7);
            
            document.getElementById('dateStart').value = todayStr;
            document.getElementById('dateStart').min = todayStr;
            document.getElementById('dateEnd').value = nextWeek.toISOString().split('T')[0];
            
            const ticker = document.getElementById('simulationTicker');
            let idx = 0;
            setInterval(() => { ticker.textContent = MESSAGES[idx]; idx = (idx + 1) % MESSAGES.length; }, 4000);
            ticker.textContent = MESSAGES[0];

            document.querySelectorAll('.chip').forEach(c => {
                c.onclick = () => {
                    document.querySelectorAll('.chip').forEach(x => x.classList.remove('active'));
                    c.classList.add('active');
                };
            });
        });

        function generateTrip() {
            const origin = document.getElementById('originSearch').value;
            const dest = document.getElementById('destSearch').value;
            const start = document.getElementById('dateStart').value;
            const end = document.getElementById('dateEnd').value;

            if (!origin || !dest || !start || !end) return alert("Please fill all configuration fields.");

            const diff = Math.ceil((new Date(end) - new Date(start)) / 86400000) + 1;
            if (diff <= 0) return alert("Check your dates.");

            state.destination = dest;
            state.days = diff;
            const data = DESTINATIONS[dest] || DESTINATIONS['Goa'];

            state.itinerary = Array.from({length: diff}, (_, i) => ({
                num: i + 1,
                items: data.activities
            }));

            render(data);
        }

        function render(data) {
            const container = document.getElementById('itineraryContent');
            container.innerHTML = '';
            
            state.itinerary.forEach(day => {
                const daySection = document.createElement('div');
                daySection.className = 'card';
                daySection.style.background = 'var(--bg)';
                daySection.innerHTML = `<div class="day-header">Day ${day.num}</div>`;
                
                day.items.forEach(item => {
                    daySection.innerHTML += `
                        <div class="activity">
                            <div class="time-badge">${item.time}</div>
                            <div class="activity-content">
                                <div class="activity-name">${item.name}</div>
                                <div class="activity-desc">${item.desc}</div>
                            </div>
                        </div>`;
                });
                container.appendChild(daySection);
            });

            document.getElementById('welcomeState').classList.add('hidden');
            document.getElementById('itineraryHeader').classList.remove('hidden');
            document.getElementById('googleMap').src = `https://www.google.com/maps/embed/v1/place?key=API_KEY&q=${state.destination}`;
            
            calculateCosts(data);
        }

        function calculateCosts(data) {
            const mult = { solo:1, couple:2, family:4 }[document.getElementById('groupSize').value] || 1;
            const items = [
                { l: 'Flights', v: data.baseCosts.flight * mult },
                { l: 'Hotel', v: data.baseCosts.hotel * state.days * Math.ceil(mult/2) },
                { l: 'Food', v: data.baseCosts.food * state.days * mult },
                { l: 'Activities', v: 2000 * state.days * mult }
            ];

            const total = items.reduce((a, b) => a + b.v, 0);
            const table = document.getElementById('costTable');
            table.innerHTML = items.map(i => `
                <div class="stat-row">
                    <span class="stat-label">${i.l}</span>
                    <span>₹${i.v.toLocaleString()}</span>
                </div>`).join('') + `
                <div class="stat-row" style="border:none; font-weight:600; margin-top:0.5rem;">
                    <span>Total Est.</span>
                    <span>₹${total.toLocaleString()}</span>
                </div>`;

            document.getElementById('budgetStatus').textContent = `Total Budget Utilization: ₹${total.toLocaleString()}`;
            drawChart(items.map(i => i.v));
        }

        function drawChart(vals) {
            const canvas = document.getElementById('costChart');
            const ctx = canvas.getContext('2d');
            const total = vals.reduce((a, b) => a + b, 0);
            const colors = ['#ffffff', '#888888', '#333333', '#111111'];
            let start = 0;
            ctx.clearRect(0,0,200,200);
            vals.forEach((v, i) => {
                const s = (v/total) * 2 * Math.PI;
                ctx.beginPath();
                ctx.arc(100, 100, 70, start, start + s);
                ctx.lineWidth = 10;
                ctx.strokeStyle = colors[i] || '#0070f3';
                ctx.stroke();
                start += s;
            });
        }

        function copyTripLink() { alert("Share link copied."); }
    </script>
</body>
</html>
