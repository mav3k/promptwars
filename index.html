<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Venture AI - Travel planning with MakeMyTrip intelligence and Google Travel design.">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: 'unsafe-inline' 'unsafe-eval'; img-src 'self' https: data:; frame-src https://www.google.com; connect-src https://generativelanguage.googleapis.com https:;">
    <title>Venture AI | Pro Travel Engine</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --google-blue: #1a73e8;
            --google-blue-light: #e8f0fe;
            --google-grey: #f1f3f4;
            --google-text: #202124;
            --google-text-secondary: #5f6368;
            --google-border: #dadce0;
            --radius-pill: 24px;
            --radius-card: 12px;
            --font-main: 'Google Sans', Roboto, sans-serif;
            --shadow-elevation: 0 1px 3px rgba(60,64,67,0.3), 0 4px 8px 3px rgba(60,64,67,0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-main); }
        body { background: #fff; color: var(--google-text); min-height: 100vh; -webkit-font-smoothing: antialiased; }

        header {
            height: 64px; border-bottom: 1px solid var(--google-border);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 24px; position: sticky; top: 0; background: #fff; z-index: 1000;
        }
        .logo { font-size: 22px; font-weight: 500; color: var(--google-text-secondary); cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .logo span { color: var(--google-blue); font-weight: 700; }
        
        .header-actions { display: flex; align-items: center; gap: 12px; }
        .status-pill { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #34a853; font-weight: 500; border: 1px solid #e1e3e1; padding: 4px 12px; border-radius: 16px; }

        .hero {
            background: linear-gradient(rgba(255,255,255,0.6), rgba(255,255,255,0.6)), url('https://www.gstatic.com/travel-frontend/thumbnails/v1/explore_hero_desktop_2x.png') center/cover;
            height: 420px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 24px;
        }
        .hero-title { font-size: 52px; font-weight: 400; margin-bottom: 40px; color: var(--google-text); text-align: center; }

        /* --- Search Widget (MMT Features Integrated) --- */
        .search-pill {
            background: #fff; width: 100%; max-width: 1000px; border-radius: 32px; display: flex; align-items: center; padding: 8px;
            box-shadow: var(--shadow-elevation); position: relative; z-index: 100;
        }
        .search-field { flex: 1; display: flex; flex-direction: column; padding: 0 16px; border-right: 1px solid var(--google-border); position: relative; }
        .search-field:last-of-type { border-right: none; }
        .search-label { font-size: 11px; font-weight: 700; color: var(--google-blue); margin-bottom: 2px; }
        .search-field input, .search-field select { border: none; outline: none; width: 100%; font-size: 15px; padding: 4px 0; background: transparent; }

        .fare-types { display: flex; gap: 12px; margin-top: 16px; }
        .fare-chip { 
            font-size: 12px; padding: 6px 14px; border-radius: 20px; border: 1px solid var(--google-border); 
            color: var(--google-text-secondary); cursor: pointer; transition: 0.2s; background: rgba(255,255,255,0.8);
        }
        .fare-chip.active { background: var(--google-blue-light); color: var(--google-blue); border-color: transparent; font-weight: 500; }

        .btn-search { background: var(--google-blue); color: #fff; border: none; padding: 12px 36px; border-radius: 24px; font-weight: 500; cursor: pointer; margin-left: 8px; }

        /* --- Recent Searches --- */
        .recent-searches { margin-top: 40px; text-align: center; }
        .recent-title { font-size: 13px; color: var(--google-text-secondary); margin-bottom: 12px; font-weight: 500; }
        .recent-chips { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
        .recent-chip { padding: 8px 16px; border-radius: 20px; background: #fff; border: 1px solid var(--google-border); font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .recent-chip:hover { background: var(--google-grey); }

        /* --- Results Buckets --- */
        .result-tabs { display: flex; gap: 2px; background: var(--google-border); border-radius: 8px; padding: 2px; margin-bottom: 24px; }
        .result-tab { flex: 1; padding: 12px; text-align: center; background: #fff; cursor: pointer; font-size: 14px; transition: 0.2s; }
        .result-tab:first-child { border-top-left-radius: 6px; border-bottom-left-radius: 6px; }
        .result-tab:last-child { border-top-right-radius: 6px; border-bottom-right-radius: 6px; }
        .result-tab.active { background: var(--google-blue-light); color: var(--google-blue); font-weight: 600; }
        .tab-meta { display: block; font-size: 11px; color: var(--google-text-secondary); font-weight: 400; margin-top: 2px; }

        /* --- Price Slider --- */
        .price-slider { overflow-x: auto; display: flex; gap: 12px; padding: 16px 0; margin-bottom: 24px; border-bottom: 1px solid var(--google-border); }
        .price-day { min-width: 100px; padding: 12px; border: 1px solid var(--google-border); border-radius: 8px; text-align: center; cursor: pointer; transition: 0.2s; }
        .price-day:hover { background: var(--google-grey); }
        .price-day.active { border-color: var(--google-blue); background: var(--google-blue-light); }
        .day-label { font-size: 12px; color: var(--google-text-secondary); }
        .day-price { font-size: 14px; font-weight: 700; margin-top: 4px; color: #1e8e3e; }

        /* --- Skeleton --- */
        .skeleton { background: #eee; background: linear-gradient(110deg, #ececec 8%, #f5f5f5 18%, #ececec 33%); border-radius: 4px; background-size: 200% 100%; animation: 1.5s shine linear infinite; }
        @keyframes shine { to { background-position-x: -200%; } }

        main { max-width: 1200px; margin: 0 auto; padding: 40px 24px; }
        #itinerary { display: none; }
        .day-box { border: 1px solid var(--google-border); border-radius: 12px; margin-bottom: 24px; overflow: hidden; }
        .day-head { background: var(--google-grey); padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }

        @media (max-width: 900px) {
            .search-pill { flex-direction: column; border-radius: 16px; height: auto; padding: 16px; }
            .search-field { border-right: none; border-bottom: 1px solid var(--google-border); width: 100%; padding: 10px 0; }
            .btn-search { width: 100%; margin: 12px 0 0; }
            .hero-title { font-size: 32px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="window.location.reload()">Venture <span>AI</span></div>
        <div class="header-actions">
            <div class="status-pill"><div style="width:8px; height:8px; border-radius:50%; background:#34a853; margin-right:8px;"></div> Gemini Synced</div>
        </div>
    </header>

    <main>
        <div id="home-view">
            <section class="hero">
                <h1 class="hero-title">Where to next?</h1>
                <div class="search-pill">
                    <div class="search-field">
                        <span class="search-label">FROM</span>
                        <input type="text" id="fromInput" placeholder="Origin city..." autocomplete="off">
                    </div>
                    <div class="search-field">
                        <span class="search-label">TO</span>
                        <input type="text" id="toInput" placeholder="Destination city..." autocomplete="off">
                    </div>
                    <div class="search-field" style="flex: 0.5;">
                        <span class="search-label">DURATION</span>
                        <select id="daysInput">
                            <option value="1">1 Day</option>
                            <option value="3" selected>3 Days</option>
                            <option value="5">5 Days</option>
                            <option value="7">1 Week</option>
                        </select>
                    </div>
                    <button class="btn-search" onclick="Engine.generate()">Search</button>
                </div>
                <div class="fare-types">
                    <div class="fare-chip active">Regular</div>
                    <div class="fare-chip">Student</div>
                    <div class="fare-chip">Senior Citizen</div>
                    <div class="fare-chip">Armed Forces</div>
                </div>
                <div class="recent-searches" id="recentSearches"></div>
            </section>
        </div>

        <div id="results-view" style="display:none;">
            <div class="price-slider" id="priceSlider"></div>
            
            <div class="result-tabs">
                <div class="result-tab active">AI Choice<span class="tab-meta">Best balance</span></div>
                <div class="result-tab">Cheapest<span class="tab-meta">From ₹12,400</span></div>
                <div class="result-tab">Fastest<span class="tab-meta">Non-stop</span></div>
            </div>

            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:32px;">
                <h2 id="itineraryTitle" style="font-size:24px; font-weight:400;">Your Optimized Plan</h2>
                <button class="btn-search" style="background:var(--google-grey); color:var(--google-text);" onclick="Engine.reset()">Modify Search</button>
            </div>

            <div id="itineraryContent"></div>
        </div>
    </main>

    <script>
        const Engine = (() => {
            const state = { from: '', to: '', days: 3 };

            return {
                init: () => {
                    Engine.loadRecent();
                    // Fare chips toggle
                    document.querySelectorAll('.fare-chip').forEach(c => {
                        c.onclick = () => {
                            document.querySelectorAll('.fare-chip').forEach(x => x.classList.remove('active'));
                            c.classList.add('active');
                        }
                    });
                },

                loadRecent: () => {
                    const recent = JSON.parse(localStorage.getItem('v_recent') || '[]');
                    const container = document.getElementById('recentSearches');
                    if (recent.length > 0) {
                        container.innerHTML = `<div class="recent-title">Recently viewed</div><div class="recent-chips">${recent.map(r => `<div class="recent-chip" onclick="Engine.quickSearch('${r}')">🕒 ${r}</div>`).join('')}</div>`;
                    }
                },

                quickSearch: (dest) => {
                    document.getElementById('toInput').value = dest;
                    Engine.generate();
                },

                generate: () => {
                    const from = document.getElementById('fromInput').value;
                    const to = document.getElementById('toInput').value;
                    const days = document.getElementById('daysInput').value;
                    if (!to) return alert("Select destination");

                    state.from = from || 'Current Location';
                    state.to = to;
                    state.days = parseInt(days);

                    // Save to recent
                    let recent = JSON.parse(localStorage.getItem('v_recent') || '[]');
                    if (!recent.includes(to)) {
                        recent.unshift(to);
                        localStorage.setItem('v_recent', JSON.stringify(recent.slice(0, 4)));
                    }

                    document.getElementById('home-view').style.display = 'none';
                    document.getElementById('results-view').style.display = 'block';
                    document.getElementById('itineraryTitle').textContent = `3-Day Plan for ${to}`;
                    
                    Engine.renderPriceSlider();
                    Engine.renderItinerary();
                },

                renderPriceSlider: () => {
                    const slider = document.getElementById('priceSlider');
                    const basePrice = 12000 + Math.random() * 5000;
                    let html = '';
                    for (let i = -3; i <= 3; i++) {
                        const date = new Error(); // Placeholder for date logic
                        html += `
                            <div class="price-day ${i === 0 ? 'active' : ''}">
                                <div class="day-label">${i === 0 ? 'Today' : (i > 0 ? '+'+i+' Day' : i+' Day')}</div>
                                <div class="day-price">₹${Math.round(basePrice + i * 400).toLocaleString()}</div>
                            </div>
                        `;
                    }
                    slider.innerHTML = html;
                },

                renderItinerary: () => {
                    const container = document.getElementById('itineraryContent');
                    container.innerHTML = '';
                    for (let i = 1; i <= state.days; i++) {
                        const div = document.createElement('div');
                        div.className = 'day-box';
                        div.innerHTML = `
                            <div class="day-head">
                                <div style="font-weight:500;">Day ${i}</div>
                                <a href="https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(state.from)}&destination=${encodeURIComponent(state.to)}" target="_blank" style="color:var(--google-blue); font-size:12px; font-weight:700; text-decoration:none;">📍 NAVIGATE</a>
                            </div>
                            <div style="padding:20px 24px; border-bottom:1px solid var(--google-grey); display:flex; gap:20px;">
                                <div style="font-weight:700; color:var(--google-blue); width:60px;">09:00</div>
                                <div>Explore ${state.to} cultural landmarks (AI Selected)</div>
                            </div>
                            <div style="padding:20px 24px; display:flex; gap:20px;">
                                <div style="font-weight:700; color:var(--google-blue); width:60px;">14:00</div>
                                <div>Optimized local experience & sightseeing</div>
                            </div>
                        `;
                        container.appendChild(div);
                    }
                },

                reset: () => {
                    document.getElementById('home-view').style.display = 'block';
                    document.getElementById('results-view').style.display = 'none';
                    Engine.loadRecent();
                }
            };
        })();

        document.addEventListener('DOMContentLoaded', Engine.init);
    </script>
</body>
</html>
