<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Venture - AI-powered travel planning with Google-inspired design.">
    <title>Travel - Venture</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --google-blue: #1a73e8;
            --google-blue-light: #e8f0fe;
            --google-grey: #f1f3f4;
            --google-text: #202124;
            --google-text-secondary: #5f6368;
            --google-border: #dadce0;
            --radius-pill: 24px;
            --radius-card: 8px;
            --font-main: 'Google Sans', Roboto, Arial, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-main); }
        body { background: #fff; color: var(--google-text); min-height: 100vh; }

        /* --- Header --- */
        header {
            height: 64px;
            border-bottom: 1px solid var(--google-border);
            display: flex;
            align-items: center;
            padding: 0 16px;
            position: sticky;
            top: 0;
            background: #fff;
            z-index: 1000;
        }

        .menu-btn { padding: 12px; cursor: pointer; border-radius: 50%; display: flex; align-items: center; }
        .menu-btn:hover { background: var(--google-grey); }
        
        .logo { font-size: 22px; font-weight: 500; color: var(--google-text-secondary); margin-left: 8px; display: flex; align-items: center; gap: 4px; }
        .logo span { color: var(--google-blue); font-weight: 700; }

        /* --- Nav Tabs --- */
        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid var(--google-border);
        }

        .tab {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 16px;
            height: 36px;
            border-radius: 18px;
            border: 1px solid var(--google-border);
            font-size: 14px;
            font-weight: 500;
            color: var(--google-text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab:hover { background: var(--google-grey); }
        .tab.active { background: var(--google-blue-light); color: var(--google-blue); border-color: transparent; }

        /* --- Hero Search --- */
        .hero {
            background-image: url('https://www.gstatic.com/travel-frontend/thumbnails/v1/explore_hero_desktop_2x.png');
            background-size: cover;
            background-position: center;
            height: 280px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 24px;
        }

        .hero-title { font-size: 44px; margin-bottom: 24px; font-weight: 400; }

        .search-container {
            background: #fff;
            width: 100%;
            max-width: 800px;
            height: 56px;
            border-radius: 28px;
            display: flex;
            align-items: center;
            padding: 0 12px;
            box-shadow: 0 1px 3px rgba(60,64,67,0.3), 0 4px 8px 3px rgba(60,64,67,0.15);
            position: relative;
        }

        .search-input-wrapper { flex: 1; display: flex; align-items: center; border-right: 1px solid var(--google-border); padding: 0 16px; }
        .search-input-wrapper:last-of-type { border-right: none; }
        
        .search-input-wrapper input {
            border: none;
            outline: none;
            width: 100%;
            font-size: 16px;
            padding: 8px 0;
            color: var(--google-text);
        }

        .search-btn {
            background: var(--google-blue);
            color: #fff;
            border: none;
            height: 40px;
            padding: 0 24px;
            border-radius: 20px;
            font-weight: 500;
            cursor: pointer;
            margin-left: 8px;
        }

        /* --- Content Grid --- */
        .main-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px 24px;
        }

        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .section-title { font-size: 22px; font-weight: 400; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        .card {
            border-radius: var(--radius-card);
            overflow: hidden;
            border: 1px solid var(--google-border);
            transition: box-shadow 0.2s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }
        .card:hover { box-shadow: 0 1px 3px rgba(60,64,67,0.3), 0 4px 8px 3px rgba(60,64,67,0.15); }

        .card-img { height: 160px; background-size: cover; background-position: center; }
        
        .card-content { padding: 16px; flex: 1; }
        .card-name { font-size: 18px; font-weight: 500; margin-bottom: 4px; }
        .card-meta { color: var(--google-text-secondary); font-size: 14px; }
        
        /* --- Autocomplete --- */
        .autocomplete {
            position: absolute;
            top: 60px;
            left: 0;
            right: 0;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.30), 0 2px 6px 2px rgba(60,64,67,0.15);
            overflow: hidden;
            display: none;
            z-index: 1001;
        }
        .autocomplete-item {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }
        .autocomplete-item:hover { background: var(--google-grey); }

        /* --- Itinerary View --- */
        #itinerary-view { display: none; margin-top: 32px; }
        .day-card { background: #fff; border: 1px solid var(--google-border); border-radius: 8px; margin-bottom: 16px; padding: 24px; }
        .day-title { font-size: 20px; font-weight: 500; margin-bottom: 16px; color: var(--google-blue); }
        .activity-list { list-style: none; }
        .activity-item { padding: 12px 0; border-bottom: 1px solid var(--google-grey); display: flex; gap: 16px; }
        .activity-item:last-child { border-bottom: none; }
        .activity-time { font-weight: 500; width: 60px; color: var(--google-text-secondary); }

        .hidden { display: none !important; }

        @media (max-width: 768px) {
            .hero-title { font-size: 32px; }
            .search-container { flex-direction: column; height: auto; padding: 16px; border-radius: 16px; }
            .search-input-wrapper { border-right: none; border-bottom: 1px solid var(--google-border); width: 100%; margin-bottom: 8px; }
            .search-btn { width: 100%; margin-left: 0; }
        }
    </style>
</head>
<body>

    <header>
        <div class="menu-btn">
            <svg width="24" height="24" viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" fill="#5f6368"/></svg>
        </div>
        <div class="logo">Venture <span>AI</span></div>
    </header>

    <div class="nav-tabs">
        <div class="tab active">
            <svg width="20" height="20" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z" fill="currentColor"/></svg>
            Travel
        </div>
        <div class="tab">Explore</div>
        <div class="tab">Flights</div>
        <div class="tab">Hotels</div>
    </div>

    <main id="explore-view">
        <section class="hero">
            <h1 class="hero-title">Where to?</h1>
            <div class="search-container">
                <div class="search-input-wrapper">
                    <input type="text" id="origin-input" placeholder="From where?" autocomplete="off">
                </div>
                <div class="search-input-wrapper">
                    <input type="text" id="dest-input" placeholder="Where to?" autocomplete="off">
                </div>
                <button class="search-btn" onclick="generatePlan()">Search</button>
                <div id="autocomplete" class="autocomplete"></div>
            </div>
        </section>

        <section class="main-content">
            <div class="section-header">
                <h2 class="section-title">Popular destinations</h2>
            </div>
            <div class="grid" id="dest-grid">
                <!-- Cards injected here -->
            </div>
            
            <div id="itinerary-view">
                <div class="section-header">
                    <h2 class="section-title">Your Trip Itinerary</h2>
                    <button class="tab" onclick="resetView()">Back to Explore</button>
                </div>
                <div id="itinerary-content"></div>
            </div>
        </section>
    </main>

    <script>
        const API_KEY = atob('QVEuQWI4Uk42SnBLYmpWRHVGRWFySWVkTHpIa0F4Vzh3Uk8zbm5IcTVPUW0xeG1rQU1OQVE=');
        
        const POPULAR = [
            { name: 'Paris', desc: 'City of Light', img: 'https://images.unsplash.com/photo-1502602898657-3e91760cbb34?w=500' },
            { name: 'Tokyo', desc: 'Neon Dreams', img: 'https://images.unsplash.com/photo-1540959733332-eab4deabeeaf?w=500' },
            { name: 'Goa', desc: 'Beach Paradise', img: 'https://images.unsplash.com/photo-1512343879784-a960bf40e7f2?w=500' },
            { name: 'London', desc: 'Historic Majesty', img: 'https://images.unsplash.com/photo-1513635269975-59663e0ac1ad?w=500' }
        ];

        const state = { origin: '', destination: '' };

        function init() {
            // Load Google Maps SDK
            if (API_KEY.startsWith('AIza')) {
                const script = document.createElement('script');
                script.src = `https://maps.googleapis.com/maps/api/js?key=${API_KEY}&libraries=places`;
                document.head.appendChild(script);
            }

            const grid = document.getElementById('dest-grid');
            POPULAR.forEach(d => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-img" style="background-image: url('${d.img}')"></div>
                    <div class="card-content">
                        <div class="card-name">${d.name}</div>
                        <div class="card-meta">${d.desc}</div>
                    </div>
                `;
                card.onclick = () => {
                    document.getElementById('dest-input').value = d.name;
                    generatePlan();
                };
                grid.appendChild(card);
            });

            setupAutocomplete('origin-input');
            setupAutocomplete('dest-input');
        }

        function setupAutocomplete(inputId) {
            const input = document.getElementById(inputId);
            const acDiv = document.getElementById('autocomplete');

            input.addEventListener('input', () => {
                const val = input.value.trim();
                acDiv.innerHTML = '';
                if (val.length < 2) { acDiv.style.display = 'none'; return; }

                const rect = input.getBoundingClientRect();
                acDiv.style.left = (rect.left - input.closest('.search-container').getBoundingClientRect().left) + 'px';
                acDiv.style.width = rect.width + 'px';
                acDiv.style.display = 'block';

                if (window.google && google.maps && google.maps.places) {
                    const service = new google.maps.places.AutocompleteService();
                    service.getPlacePredictions({ input: val, types: ['(cities)'] }, (preds) => {
                        if (preds) renderAC(preds.map(p => p.description), input);
                    });
                } else {
                    const mock = [
                        'New York, USA', 'London, UK', 'Paris, France', 'Tokyo, Japan', 'Dubai, UAE', 'Singapore', 'Delhi, India', 'Mumbai, India', 'Sydney, Australia', 'Berlin, Germany', 
                        'Rome, Italy', 'Madrid, Spain', 'Hong Kong', 'San Francisco, USA', 'Los Angeles, USA', 'Chicago, USA', 'Toronto, Canada', 'Vancouver, Canada', 'Istanbul, Turkey', 'Amsterdam, Netherlands', 
                        'Zurich, Switzerland', 'Vienna, Austria', 'Seoul, South Korea', 'Shanghai, China', 'Beijing, China', 'Bangkok, Thailand', 'Kuala Lumpur, Malaysia', 'Jakarta, Indonesia', 'Johannesburg, South Africa', 'Cairo, Egypt',
                        'Goa, India', 'Bali, Indonesia', 'Maldives', 'Santorini, Greece', 'Venice, Italy', 'Kyoto, Japan', 'Machu Picchu, Peru', 'Cape Town, South Africa', 'Rio de Janeiro, Brazil', 'Barcelona, Spain', 
                        'Prague, Czech Republic', 'Edinburgh, UK', 'Reykjavik, Iceland', 'Queenstown, New Zealand', 'Bora Bora, French Polynesia', 'Maui, USA', 'Phuket, Thailand', 'Siem Reap, Cambodia', 'Petra, Jordan', 'Marrakesh, Morocco', 
                        'Dubrovnik, Croatia', 'Florence, Italy', 'Amalfi Coast, Italy', 'Swiss Alps, Switzerland', 'Jasper, Canada', 'Banff, Canada', 'Yosemite, USA', 'Grand Canyon, USA', 'Great Barrier Reef, Australia', 'Lisbon, Portugal'
                    ].filter(s => s.toLowerCase().includes(val.toLowerCase()));
                    renderAC(mock, input);
                }
            });
        }

        function renderAC(matches, input) {
            const acDiv = document.getElementById('autocomplete');
            acDiv.innerHTML = matches.map(m => `<div class="autocomplete-item">📍 ${m}</div>`).join('');
            acDiv.querySelectorAll('.autocomplete-item').forEach((item, i) => {
                item.onclick = () => {
                    input.value = matches[i];
                    acDiv.style.display = 'none';
                };
            });
        }

        function generatePlan() {
            const origin = document.getElementById('origin-input').value;
            const dest = document.getElementById('dest-input').value;
            if (!dest) return alert("Where to?");

            state.origin = origin || 'Your Location';
            state.destination = dest;

            const view = document.getElementById('itinerary-view');
            const grid = document.getElementById('dest-grid');
            const content = document.getElementById('itinerary-content');
            
            grid.classList.add('hidden');
            view.style.display = 'block';
            content.innerHTML = '';

            // Day-wise Logic
            const days = [
                { day: 1, activities: [{time: '09:00', task: `Explore central ${dest}`}, {time: '14:00', task: 'Local Cultural Tour'}] },
                { day: 2, activities: [{time: '10:00', task: 'Hidden Gems discovery'}, {time: '19:00', task: 'Evening highlights'}] }
            ];
            
            days.forEach(day => {
                const dCard = document.createElement('div');
                dCard.className = 'day-card';
                dCard.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                        <div class="day-title">Day ${day.day}</div>
                        <a href="https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(state.origin)}&destination=${encodeURIComponent(state.destination)}" 
                           target="_blank" style="color:var(--google-blue); font-size:12px; text-decoration:none; font-weight:500;">
                           📍 Get Directions
                        </a>
                    </div>
                    <ul class="activity-list">
                        ${day.activities.map(a => `
                            <li class="activity-item">
                                <span class="activity-time">${a.time}</span>
                                <span>${a.task}</span>
                            </li>
                        `).join('')}
                    </ul>
                `;
                content.appendChild(dCard);
            });

            window.scrollTo({ top: 400, behavior: 'smooth' });
        }

        function resetView() {
            document.getElementById('dest-grid').classList.remove('hidden');
            document.getElementById('itinerary-view').style.display = 'none';
            document.getElementById('dest-input').value = '';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        init();
    </script>
</body>
</html>
